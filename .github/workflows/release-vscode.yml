name: Release VS Code extension

on:
  push:
    tags:
      - 'vscode@*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vscode
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: target
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [[ "$REF_TYPE" == tag ]] || exit 0
          version="${REF_NAME#vscode@}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $REF_NAME does not end in a x.y.z version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        working-directory: .
      - run: pnpm --filter localness-vscode... typecheck
        working-directory: .

      - name: Set version
        if: steps.target.outputs.version
        run: npm pkg set version="${{ steps.target.outputs.version }}"

      - run: pnpm --filter localness-vscode... build
        working-directory: .
      - run: pnpm --filter localness-vscode... test
        working-directory: .

      - run: pnpm exec vsce package --no-dependencies --out localness.vsix

      # --skip-duplicate lets a failed run be retried after one of the two stores succeeded.
      - name: Publish to VS Code Marketplace
        run: pnpm exec vsce publish --oidc --packagePath localness.vsix --skip-duplicate

      - name: Publish to Open VSX
        run: pnpm exec ovsx publish localness.vsix --trusted-publishing --skip-duplicate

      - name: Commit version to main
        if: steps.target.outputs.version
        env:
          VERSION: ${{ steps.target.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git reset --hard
          git fetch origin main
          git checkout -B main origin/main
          npm pkg set version="$VERSION"
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $REF_NAME"
          git push origin main
