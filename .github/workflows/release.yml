name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
      - 'sdk@*'
      - 'cli@*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sdk@x.y.z and cli@x.y.z release one package; vx.y.z releases both at that version.
      - name: Resolve packages and version
        id: target
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [[ "$REF_TYPE" == tag ]] || exit 0
          if [[ "$REF_NAME" == *@* ]]; then
            packages="${REF_NAME%@*}"
            version="${REF_NAME#*@}"
          else
            packages="sdk cli"
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $REF_NAME does not end in a x.y.z version"
            exit 1
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; pnpm publish delegates to the npm CLI.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Set versions
        if: steps.target.outputs.version
        env:
          PACKAGES: ${{ steps.target.outputs.packages }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          for pkg in $PACKAGES; do
            npm pkg set version="$VERSION" --prefix "packages/$pkg"
          done

      - run: pnpm build
      - run: pnpm test

      # Without a tag, pnpm publishes every public package whose version is not on npm yet.
      - name: Publish
        env:
          PACKAGES: ${{ steps.target.outputs.packages }}
        run: |
          filters=()
          for pkg in $PACKAGES; do filters+=(--filter "./packages/$pkg"); done
          pnpm -r "${filters[@]}" publish --access public --no-git-checks

      - name: Commit versions to main
        if: steps.target.outputs.version
        env:
          PACKAGES: ${{ steps.target.outputs.packages }}
          VERSION: ${{ steps.target.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git reset --hard
          git fetch origin main
          git checkout -B main origin/main
          for pkg in $PACKAGES; do
            npm pkg set version="$VERSION" --prefix "packages/$pkg"
          done
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $REF_NAME"
          git push origin main
